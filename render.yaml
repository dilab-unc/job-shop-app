# Render deployment configuration
# This file can be used for Render Blueprint deployment
# Or configure services manually in Render dashboard

services:
  - type: web
    name: jobshop-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobshop-db
          property: connectionString
      - key: DEBUG
        value: False
      - key: ECHO_SQL
        value: False

  - type: web
    name: jobshop-frontend
    env: python
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: cd frontend && streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      # IMPORTANT: Set API_URL manually in Render dashboard to your backend URL + /api
      # Example: https://jobshop-backend.onrender.com/api
      # The fromService property below may not work correctly, so set it manually:
      - key: API_URL
        value: ""  # Set this manually in Render dashboard after deployment

databases:
  - name: jobshop-db
    plan: free
    databaseName: jobshop
    user: jobshop

